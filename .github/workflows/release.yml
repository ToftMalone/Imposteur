name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish (e.g. v0.1)"
        required: true
        default: "v0.1"

permissions:
  contents: write

# Actions are pinned to a full commit, not a movable tag: this job holds the
# signing key, so a re-pointed tag must not be able to run code in it.

jobs:
  release:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false

    steps:
      # On a tag push this checks out the tag. On a manual run it checks out the
      # branch the workflow was started from, and the publish step creates the
      # tag at that commit.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The keystore lives in repository secrets, never in the repository.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > imposteur-release.keystore
          echo "Keystore restored ($(stat -c%s imposteur-release.keystore) bytes)"

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --console=plain --stacktrace

      - name: Check tests actually ran
        run: python3 scripts/check-test-results.py "app/build/test-results/testReleaseUnitTest/*.xml"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: imposteur-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain --stacktrace

      # A release that quietly came out unsigned would install nowhere useful.
      - name: Verify the APK is really signed
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "Verifying $APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp "$APK" "Imposteur-${VERSION}.apk"
          sha256sum "Imposteur-${VERSION}.apk" | tee checksum.txt
          echo "APK_PATH=Imposteur-${VERSION}.apk" >> "$GITHUB_ENV"

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f imposteur-release.keystore

      # Aussi disponible depuis la page de l'exécution, pas seulement sur la
      # release: c'est là qu'on regarde spontanément après un build.
      - name: Upload the APK as a run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imposteur-release-apk
          path: |
            ${{ env.APK_PATH }}
            checksum.txt
          if-no-files-found: error

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Imposteur ${{ github.event.inputs.tag || github.ref_name }}
          # Also bundled in the app for its "Quoi de neuf ?" window.
          body_path: app/src/main/assets/RELEASE_NOTES.md
          files: |
            ${{ env.APK_PATH }}
            checksum.txt
          draft: false
          # Une vraie release, pas une pre-release: GitHub masque les
          # pre-releases de l'encart Releases et ne leur donne pas le badge
          # "Latest". Le caractère bêta est dit dans les notes.
          prerelease: false
