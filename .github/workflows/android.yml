name: Android CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

# The build only reads the repository; nothing here needs to write to it.
permissions:
  contents: read

# A new push supersedes a run still in flight, so a stuck build does not
# block the next attempt.
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GRADLE_OPTS: -Dorg.gradle.console=plain -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; we only make sure the
      # platform this project compiles against is present and licensed.
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Resolve dependencies
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain -q > /dev/null

      - name: Compile debug sources
        run: ./gradlew compileDebugKotlin --console=plain --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      # A passing test task with zero tests would otherwise look identical to a
      # real green run, so assert that tests actually executed.
      - name: Check tests actually ran
        run: python3 scripts/check-test-results.py

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      # Builds the release variant through R8 (minify + resource shrinking) with
      # no signing key, so shrinking mistakes surface here rather than at release.
      - name: Assemble release (unsigned, R8 check)
        run: ./gradlew assembleRelease --console=plain --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: imposteur-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
